<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="options.css">
<title data-i18n="optionsTitle"></title>
</head>
<body>
<main>
  <h1 data-i18n="optionsTitle"></h1>
  <p class="intro" data-i18n="optionsIntro"></p>
  <section class="card">
    <label for="max" data-i18n="maxSubjectLabel"></label>
    <div class="row">
      <input type="number" id="max" min="0" step="1" inputmode="numeric">
      <span data-i18n="charactersUnit"></span>
      <span id="saved" class="saved" data-i18n="savedNote" hidden></span>
    </div>
    <p class="hint" data-i18n="maxSubjectHint"></p>
  </section>
</main>
<script src="options.js"></script>
</body>
</html>
